<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>粉紅魔法打地鼠 - Pink Magic Whac-A-Mole</title>
    <!-- 使用 React CDN 讓遊戲可直接執行 -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        :root {
            --pink-primary: #ff85a2;
            --pink-secondary: #ffafbd;
            --magic-star: #fff176;
            --mole-brown: #a67c52;
            --hole-color: #d1a58c;
            --bg-color: #fff0f3;
        }

        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-color);
            /* 隱藏預設游標，因為我們要用魔法棒 */
            cursor: none;
            user-select: none;
        }

        #root {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        /* 魔法棒游標 */
        .magic-wand {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            width: 40px;
            height: 40px;
            transform: translate(-20%, -20%);
            transition: transform 0.05s ease-out;
        }

        .wand-star {
            width: 24px;
            height: 24px;
            background: var(--magic-star);
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            box-shadow: 0 0 10px var(--magic-star);
            animation: pulse 1s infinite;
        }

        .wand-handle {
            width: 6px;
            height: 30px;
            background: linear-gradient(to bottom, var(--pink-primary), #fff);
            margin-left: 9px;
            margin-top: -5px;
            border-radius: 3px;
            transform: rotate(-15deg);
        }

        @keyframes pulse {
            0% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.2); filter: brightness(1.2); }
            100% { transform: scale(1); filter: brightness(1); }
        }

        .game-header {
            text-align: center;
            margin-bottom: 20px;
            color: var(--pink-primary);
        }

        .score-board {
            font-size: 2rem;
            font-weight: bold;
            text-shadow: 2px 2px #fff;
        }

        .timer {
            font-size: 1.2rem;
            margin-top: 5px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 120px);
            grid-gap: 20px;
            background: #fff;
            padding: 30px;
            border-radius: 40px;
            box-shadow: 0 10px 30px rgba(255, 133, 162, 0.2);
            border: 5px border-style: dotted; border-color: var(--pink-secondary);
        }

        .hole {
            width: 120px;
            height: 90px;
            background: var(--hole-color);
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 10px 10px rgba(0,0,0,0.3);
        }

        /* 可愛地鼠 */
        .mole {
            width: 90px;
            height: 100px;
            background: var(--mole-brown);
            border-radius: 45px 45px 10px 10px;
            position: absolute;
            bottom: -100px;
            left: 15px;
            transition: bottom 0.2s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 15px;
        }

        .mole.up {
            bottom: 0px;
        }

        .mole-eyes {
            display: flex;
            gap: 15px;
            margin-bottom: 5px;
        }

        .mole-eye {
            width: 12px;
            height: 12px;
            background: #333;
            border-radius: 50%;
            position: relative;
        }

        .mole-eye::after {
            content: '';
            width: 4px;
            height: 4px;
            background: #fff;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 2px;
        }

        .mole-blush {
            display: flex;
            gap: 40px;
            margin-top: -8px;
        }

        .blush {
            width: 15px;
            height: 8px;
            background: #ff9999;
            border-radius: 50%;
            opacity: 0.6;
        }

        .mole-nose {
            width: 10px;
            height: 6px;
            background: #5d4037;
            border-radius: 50%;
        }

        /* 魔法打擊特效 */
        .particle {
            position: fixed;
            pointer-events: none;
            background: var(--pink-primary);
            width: 10px;
            height: 10px;
            border-radius: 50%;
            z-index: 1001;
            animation: explode 0.6s ease-out forwards;
        }

        @keyframes explode {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0.1) translate(var(--tx), var(--ty)); opacity: 0; }
        }

        .start-btn {
            background: var(--pink-primary);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            border-radius: 30px;
            cursor: none; /* 保持隱藏游標 */
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(255, 133, 162, 0.4);
            transition: transform 0.2s;
        }

        .start-btn:hover {
            transform: scale(1.1);
            background: #ff6b8e;
        }

        .game-over {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const MagicWand = () => {
            const [pos, setPos] = useState({ x: 0, y: 0 });
            const [isClicking, setIsClicking] = useState(false);

            useEffect(() => {
                const handleMouseMove = (e) => {
                    setPos({ x: e.clientX, y: e.clientY });
                };
                const handleMouseDown = () => setIsClicking(true);
                const handleMouseUp = () => setIsClicking(false);

                window.addEventListener('mousemove', handleMouseMove);
                window.addEventListener('mousedown', handleMouseDown);
                window.addEventListener('mouseup', handleMouseUp);
                return () => {
                    window.removeEventListener('mousemove', handleMouseMove);
                    window.removeEventListener('mousedown', handleMouseDown);
                    window.removeEventListener('mouseup', handleMouseUp);
                };
            }, []);

            return (
                <div 
                    className="magic-wand" 
                    style={{ 
                        left: pos.x, 
                        top: pos.y, 
                        transform: `translate(-10px, -10px) rotate(${isClicking ? '-20deg' : '0deg'}) scale(${isClicking ? 0.9 : 1})`
                    }}
                >
                    <div className="wand-star"></div>
                    <div className="wand-handle"></div>
                </div>
            );
        };

        const ParticleEffect = ({ x, y }) => {
            return [...Array(8)].map((_, i) => {
                const tx = (Math.random() - 0.5) * 100;
                const ty = (Math.random() - 0.5) * 100;
                return (
                    <div 
                        key={i} 
                        className="particle" 
                        style={{ 
                            left: x, 
                            top: y, 
                            '--tx': `${tx}px`, 
                            '--ty': `${ty}px` 
                        }}
                    ></div>
                );
            });
        };

        const Game = () => {
            const [score, setScore] = useState(0);
            const [timeLeft, setTimeLeft] = useState(30);
            const [activeMole, setActiveMole] = useState(null);
            const [gameState, setGameState] = useState('IDLE'); // IDLE, PLAYING, ENDED
            const [particles, setParticles] = useState([]);
            
            const timerRef = useRef(null);
            const moleTimerRef = useRef(null);

            const startGame = () => {
                setScore(0);
                setTimeLeft(30);
                setGameState('PLAYING');
                showMole();
            };

            const showMole = () => {
                const randomHole = Math.floor(Math.random() * 9);
                setActiveMole(randomHole);
                
                // 難度曲線：地鼠停留時間
                const delay = Math.max(500, 1000 - (score * 20));
                
                moleTimerRef.current = setTimeout(() => {
                    setActiveMole(null);
                    if (gameState !== 'ENDED') {
                        setTimeout(showMole, Math.random() * 500 + 200);
                    }
                }, delay);
            };

            useEffect(() => {
                if (gameState === 'PLAYING') {
                    timerRef.current = setInterval(() => {
                        setTimeLeft(prev => {
                            if (prev <= 1) {
                                clearInterval(timerRef.current);
                                clearTimeout(moleTimerRef.current);
                                setGameState('ENDED');
                                return 0;
                            }
                            return prev - 1;
                        });
                    }, 1000);
                }
                return () => {
                    clearInterval(timerRef.current);
                    clearTimeout(moleTimerRef.current);
                };
            }, [gameState]);

            const handleWhack = (index, e) => {
                if (index === activeMole) {
                    setScore(s => s + 10);
                    setActiveMole(null);
                    clearTimeout(moleTimerRef.current);
                    
                    // 特效
                    const newParticles = { x: e.clientX, y: e.clientY, id: Date.now() };
                    setParticles(p => [...p, newParticles]);
                    setTimeout(() => {
                        setParticles(p => p.filter(item => item.id !== newParticles.id));
                    }, 600);

                    // 下一隻地鼠出現快一點
                    setTimeout(showMole, 100);
                }
            };

            return (
                <>
                    <MagicWand />
                    {particles.map(p => <ParticleEffect key={p.id} x={p.x} y={p.y} />)}
                    
                    <div className="game-header">
                        <h1 style={{fontSize: '3rem', margin: '0'}}>魔法打地鼠 ✨</h1>
                        <div className="score-board">分數: {score}</div>
                        <div className="timer">剩餘時間: {timeLeft}s</div>
                    </div>

                    <div className="grid">
                        {[...Array(9)].map((_, i) => (
                            <div key={i} className="hole">
                                <div 
                                    className={`mole ${activeMole === i ? 'up' : ''}`}
                                    onMouseDown={(e) => handleWhack(i, e)}
                                >
                                    <div className="mole-eyes">
                                        <div className="mole-eye"></div>
                                        <div className="mole-eye"></div>
                                    </div>
                                    <div className="mole-blush">
                                        <div className="blush"></div>
                                        <div className="blush"></div>
                                    </div>
                                    <div className="mole-nose"></div>
                                </div>
                            </div>
                        ))}
                    </div>

                    {gameState === 'IDLE' && (
                        <div className="game-over">
                            <h2 style={{color: 'var(--pink-primary)', fontSize: '2rem'}}>準備好要施展魔法了嗎？</h2>
                            <button className="start-btn" onClick={startGame}>開始遊戲</button>
                        </div>
                    )}

                    {gameState === 'ENDED' && (
                        <div className="game-over">
                            <h1 style={{color: 'var(--pink-primary)', fontSize: '4rem'}}>時間到！</h1>
                            <div className="score-board" style={{fontSize: '3rem'}}>最終得分: {score}</div>
                            <button className="start-btn" onClick={startGame}>再玩一次</button>
                        </div>
                    )}
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Game />);
    </script>
</body>
</html>
